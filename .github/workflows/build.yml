name: 构建安装包

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装主应用依赖
        run: npm ci

      - name: 安装子应用依赖
        run: cd sub-apps/test-data-generator && npm ci
        shell: cmd

      - name: 构建安装包
        run: node scripts/build-installer.js
        shell: cmd

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: 测试工具-Setup-${{ github.ref_name }}
          path: release/测试工具 Setup *.exe

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 测试工具 ${{ github.ref_name }}
          body: |
            ## 测试工具 ${{ github.ref_name }}

            Windows 集成工具：网址密码管理 + 测试数据生成。

            ### 安装方式
            下载下方的 `.exe` 安装包，运行后按提示安装即可。

            ### 功能特性
            - AES-256-GCM 加密密码存储
            - 卡片/列表双视图
            - 标签管理、回收站
            - CSV/JSON/XLSX 导入导出
            - 浏览器检测与一键打开
            - 自动锁定、剪贴板自动清空
            - 测试数据生成（SQL注入、身份证、手机号等 17 种类型）
          files: release/测试工具 Setup *.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
